<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">A9 Part 1 — Confirmed Pattern Architecture Diagram</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">NestJS Airline Reservation System Baseline (Commit: ae2c248)</text>

  <!-- Dynamic Guard Factory -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="350" height="480" rx="12" fill="url(#boxGrad1)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="40" y="110" width="350" height="38" rx="12" fill="#2563eb"/>
    <text x="215" y="135" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">DYNAMIC GUARD FACTORY</text>

    <!-- rolesRestrict -->
    <rect x="60" y="170" width="310" height="90" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="75" y="195" fill="#60a5fa" font-size="14" font-weight="bold">rolesRestrict(...allowedRoles)</text>
    <text x="75" y="217" fill="#94a3b8" font-size="12">Factory Function | Closure over roles</text>
    <text x="75" y="238" fill="#cbd5e1" font-size="11">src/flight/guards/roles.restrict.guard.ts:12</text>

    <!-- RolesRestriceGuard -->
    <rect x="60" y="300" width="310" height="110" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="75" y="325" fill="#38bdf8" font-size="14" font-weight="bold">RolesRestriceGuard (Dynamic Product)</text>
    <text x="75" y="347" fill="#94a3b8" font-size="12">Implements CanActivate | Injects UsersService</text>
    <text x="75" y="367" fill="#e2e8f0" font-size="11">Evaluates: allowedRoles.includes(user.role)</text>
    <text x="75" y="387" fill="#cbd5e1" font-size="11">src/flight/guards/roles.restrict.guard.ts:14-26</text>

    <!-- CanActivate Interface -->
    <rect x="60" y="450" width="310" height="90" rx="8" fill="#0f172a" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="75" y="475" fill="#93c5fd" font-size="14" font-weight="bold">CanActivate (Product Interface)</text>
    <text x="75" y="497" fill="#94a3b8" font-size="12">NestJS Guard Interface Contract</text>
    <text x="75" y="517" fill="#cbd5e1" font-size="11">canActivate(context: ExecutionContext)</text>
  </g>

  <!-- DataLoader Batch Loaders -->
  <g filter="url(#shadow)">
    <rect x="425" y="110" width="350" height="480" rx="12" fill="url(#boxGrad2)" stroke="#818cf8" stroke-width="2"/>
    <rect x="425" y="110" width="350" height="38" rx="12" fill="#4f46e5"/>
    <text x="600" y="135" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">DATALOADER BATCH LOADERS</text>

    <!-- UserDataLoader -->
    <rect x="445" y="170" width="310" height="110" rx="8" fill="#0f172a" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="460" y="195" fill="#a5b4fc" font-size="14" font-weight="bold">UserDataLoader (User Batch Loader)</text>
    <text x="460" y="217" fill="#94a3b8" font-size="12">Request-scoped Provider | userLoader</text>
    <text x="460" y="237" fill="#e2e8f0" font-size="11">Coalesces user IDs into SQL WHERE id IN (...)</text>
    <text x="460" y="257" fill="#cbd5e1" font-size="11">src/users/loaders/user.loader.ts:10-24</text>

    <!-- FlightDataLoader -->
    <rect x="445" y="300" width="310" height="110" rx="8" fill="#0f172a" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="460" y="325" fill="#a5b4fc" font-size="14" font-weight="bold">FlightDataLoader (Flight Batch Loader)</text>
    <text x="460" y="347" fill="#94a3b8" font-size="12">Request-scoped Provider | flightLoader</text>
    <text x="460" y="367" fill="#e2e8f0" font-size="11">Batch fetches flights via TypeORM In()</text>
    <text x="460" y="387" fill="#cbd5e1" font-size="11">src/flight/loaders/flight.loader.ts:7-23</text>

    <!-- SeatDataLoader -->
    <rect x="445" y="430" width="310" height="130" rx="8" fill="#0f172a" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="460" y="455" fill="#a5b4fc" font-size="14" font-weight="bold">SeatDataLoader (Seat Batch Loader)</text>
    <text x="460" y="477" fill="#94a3b8" font-size="12">Request-scoped Provider</text>
    <text x="460" y="497" fill="#e2e8f0" font-size="11">seatLoader (single) &amp; seatManyLoader (relation)</text>
    <text x="460" y="517" fill="#cbd5e1" font-size="11">src/seat/loaders/seat.loader.ts:8-45</text>
  </g>

  <!-- Async Email Queue (Producer-Consumer) -->
  <g filter="url(#shadow)">
    <rect x="810" y="110" width="350" height="480" rx="12" fill="url(#boxGrad3)" stroke="#34d399" stroke-width="2"/>
    <rect x="810" y="110" width="350" height="38" rx="12" fill="#059669"/>
    <text x="985" y="135" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">PRODUCER-CONSUMER QUEUE</text>

    <!-- Producers -->
    <rect x="830" y="170" width="310" height="110" rx="8" fill="#0f172a" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="845" y="195" fill="#6ee7b7" font-size="14" font-weight="bold">Job Producers</text>
    <text x="845" y="217" fill="#94a3b8" font-size="12">SendGridService &amp; UsersResolver</text>
    <text x="845" y="237" fill="#e2e8f0" font-size="11">Dispatches email payloads to queue</text>
    <text x="845" y="257" fill="#cbd5e1" font-size="11">src/users/send-grid.service.ts:30-42</text>

    <!-- BullMQ Channel -->
    <rect x="830" y="300" width="310" height="90" rx="8" fill="#022c22" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
    <text x="845" y="325" fill="#a7f3d0" font-size="14" font-weight="bold">BullMQ Queue Channel: 'email'</text>
    <text x="845" y="347" fill="#6ee7b7" font-size="12">Redis Message Queue</text>
    <text x="845" y="367" fill="#cbd5e1" font-size="11">src/app.module.ts:27-31</text>

    <!-- EmailProcessor Consumer -->
    <rect x="830" y="420" width="310" height="140" rx="8" fill="#0f172a" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="845" y="445" fill="#34d399" font-size="14" font-weight="bold">EmailProcessor (WorkerHost Consumer)</text>
    <text x="845" y="467" fill="#94a3b8" font-size="12">Asynchronous Job Consumer</text>
    <text x="845" y="487" fill="#e2e8f0" font-size="11">Processes sending-token-sendGrid &amp; mailtrap</text>
    <text x="845" y="507" fill="#cbd5e1" font-size="11">src/users/workers/email.worker.ts:8-25</text>
  </g>

  <!-- Connectors -->
  <!-- rolesRestrict to RolesRestriceGuard -->
  <path d="M 215 260 L 215 300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- RolesRestriceGuard to CanActivate -->
  <path d="M 215 410 L 215 450" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  
  <!-- Producer to BullMQ -->
  <path d="M 985 280 L 985 300" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- BullMQ to Consumer -->
  <path d="M 985 390 L 985 420" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

</svg>